[[questions]]
ask = "Which telegram does a unit run on EtherNet/IP as delivered, and is the 24-byte DriveProfile image telegram 111 (the only one the manual lists with 12 PZD)? The manual says the 'Telegram selection' parameter (P0.3030101) picks the telegram and the mapping, and gives no default."
source = "Manual CMMT-AS-...-S1 PDF p. 855 (Tab. 1089), PDF p. 880 (Tab. 1157, Tab. 1158)"

[[questions]]
ask = "Byte order and word offsets of the process data: the manual numbers words PZD1 to PZD12 and does not give byte offsets or byte order for EtherNet/IP. Is PZD1 at byte 0, low byte first?"
source = "Manual CMMT-AS-...-S1 PDF p. 881 Tab. 1159 and Tab. 1160"
