[[questions]]
ask = "Which bit of the output image switches which solenoid coil, and which bits do the two status bytes carry? The operating instructions say the I-Port device sets the data and refer to an 'Appendix to operating instructions' (the CTEU-EP EtherNet/IP objects) that is not in the store."
source = "Operating instructions CTEU-EP PDF p. 2, section 6 (EtherNet/IP Objects): 'For detailed information on the objects ... Appendix to operating instructions'"

[[questions]]
ask = "The manual's connection table says to enter Configuration assembly instance 102 with size 0 in a Generic Ethernet Module; the EDS gives assembly 102 as 38 bytes. Which does a unit accept?"
source = "Operating instructions CTEU-EP PDF p. 2, section 5.5 step 9; EDS Assem102 (config_assembly bytes = 38 in this entry)"
