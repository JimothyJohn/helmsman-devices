[device]
vendor = "Murrelektronik"
model = "IMPACT67 E DIO8 (DIO8)"
kind = "remote-io"
article = "55089"
channels = "16 DIO (pin 4 and pin 2 of 8 M12 ports, each an input or an output, 1.6 A)"
checked_on = "2026-11-16"
firmware = "revision 1.2 (ListIdentity)"
checked_by = "helmsman bench"
profile = "murrelektronik-impact67-e-dio8-dio8.device"   # the device profile a controller copies into a project (helmsman-device 1)
# The unit confirmed the identity, the assemblies and the connection (README.md,
# "On the bench"). No channel was seen switching: nothing was wired to it.

[identity.enip]
vendor_id = 640                  # handbook p. 101; a unit 2026-11-16
product_code = 55089             # a unit 2026-11-16
device_type = 7                  # a unit 2026-11-16
revisions = ["1.2"]
product_name = "IMPACT67 E DIO8 (DIO8)"

[protocols.enip]
driver = "enip-io"
map = "enip.map"
rpi_ms = { min = 5, default = 10 }   # the handbook gives no maximum
input_assembly = { instance = 117, bytes = 8 }
output_assembly = { instance = 35, bytes = 2 }
# Out of its box the block takes its channel setup from the controller
# ("Over EDS File"): configuration instance 109, three bytes the handbook
# describes (pp. 62-63, 70); the unit reports the instance as 4 bytes and
# takes 3 padded to 4. Instance 110 (0 bytes) is for a block set to "Over
# Web Server", and is refused 0x0119 otherwise.
config_assembly = { instance = 109, bytes = 3 }
# It sends its inputs to UDP 2222 whatever port the Forward_Open names
# (a T->O socket-address item is ignored; unit, 2026-11-16).

[wiring]
note = "Bus over M12 D-coded; power over 7/8\": US 24 V (18-30 V) for the module and sensors, UA 24 V for the actuators, 9 A at most per connector. An output that overloads shuts down and stays off until the controller writes it 0 and then 1."
source = "IMPACT67 E handbook ed. 1.8 pp. 24-26, 33, 91"

[[sources]]
title = "Manual for the Devices of the IMPACT67 E Series, art. no. 55368, edition 1.8 (2019-06)"
sha256 = "f01edb0ad41cc1aa12de4984c68e1384afc3e6a6df38694401623be58d77c77f"
where = "Murrelektronik's download area, article 55368; not redistributed here"

[[questions]]
ask = "What do the outputs do when the controller's connection times out or is closed? After a Forward_Close the output assembly still read the last values written (unit, 2026-11-16); nobody was watching the channel LEDs."
source = "IMPACT67 E handbook ed. 1.8 p. 83 (the NS LED only); a unit 2026-11-16"

[[questions]]
ask = "Does the article's EDS agree with the unit: configuration instance 109 at 3 or 4 bytes, the RPI range, the real-time formats? The EDS could not be fetched (collect/murrelektronik.toml)."
source = "IMPACT67 E handbook ed. 1.8 p. 70 (3 bytes); a unit 2026-11-16 (Get_Attribute_Single: 4 bytes)"
