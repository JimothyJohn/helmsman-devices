[[questions]]
ask = "What do the outputs do when the controller's connection times out or is closed? After a Forward_Close the output assembly still read the last values written (unit, 2026-11-16); nobody was watching the channel LEDs."
source = "IMPACT67 E handbook ed. 1.8 p. 83 (the NS LED only); a unit 2026-11-16"
