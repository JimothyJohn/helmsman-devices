# Written by hand from the manual. No unit has been checked: checked_on,
# firmware and checked_by stay out until one has.
[device]
vendor = "Acromag"
model = "XT1121-000"
kind = "remote-io"
channels = "16 DI (active-high), 16 DO (high-side, sourcing)"

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# Unit ID: the manual says a slave ignores it and echoes it back (p. 28, the Modbus TCP frame note).

[[points]]
name = "DI group 0..3"
modbus = "ir:0..ir:3 (3x 30001-30004, FC 4; one word a group of 4 channels, bit n = channel n of the group)"
meaning = "input state, 1 = on (active-high input asserted above 2.0 V)"
source = "XT1121-000 User's Manual 8500950 p. 33-34"

[[points]]
name = "heart beat"
modbus = "ir:4 (3x 30005, FC 4)"
meaning = "counter that increments by 1 for each host-to-network transfer, 0 to 65535; shows whether the data is fresh"
source = "XT1121-000 User's Manual 8500950 p. 34"

[[points]]
name = "DO group 0..3"
modbus = "hr:0..hr:3 (4x 40001-40004, FC 3, 6, 16; bit n = output channel n of the group)"
meaning = "output state command, 1 = on (output closed), 0 = off (open)"
source = "XT1121-000 User's Manual 8500950 p. 34-35"

[[points]]
name = "module identity"
modbus = "FC 17 Report Slave ID (hidden function)"
meaning = "a string such as Acromag,XT1121-xxx,9300-217 in the manual's example"
source = "XT1121-000 User's Manual 8500950 p. 32"

[[questions]]
ask = "Are the XT1121-000 holding registers kept in flash across a power cycle? The XT1121 manual says holding register values are not maintained in non-volatile flash, the sister XT1111 manual says they are."
source = "XT1121-000 manual 8500950 p. 33 (not maintained) and XT1111-000 manual 8500949 p. 33 (maintained)"

[[sources]]
