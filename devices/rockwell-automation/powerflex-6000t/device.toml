# Drafted by scripts/eds-draft.py from the EDS; the [[points]] were then read by hand from the
# manual listed under [[sources]], page by page. No unit has been checked: checked_on, firmware
# and checked_by stay out until one has, and every value below is what the vendor's files say,
# not what a device did.
[device]
vendor = "Rockwell Automation"
model = "PowerFlex 6000T"
kind = "drive"
category = "drive"
channels = "1 drive: logic command, reference, 16 datalinks out; logic status, feedback, 16 datalinks in"   # from: EDS Assem2 'Output' (Logic Command, Reference, DL Out 1-16) and Assem1 'Input' (Logic Status, Feedback, DL In 1-16)
article = "6000T..."

[identity.enip]
vendor_id = 1
product_code = 10640
device_type = 143
revisions = ["11.1"]   # the EDS's MajRev.MinRev
product_name = "PowerFlex 6000T MV AC Drive"

[protocols.enip]
driver = "enip-io"
# from Connection1 "Discrete Exclusive Owner"
# input_assembly: the size is set by Param1: 12..76 bytes, default 12
input_assembly = { instance = 1 }
# output_assembly: the size is set by Param2: 8..72 bytes, default 8
output_assembly = { instance = 2 }
config_assembly = { instance = 6 }
eds = { name = "12040.08_EDS", size = 40833, sha256 = "42d2fad7e8521edb5f193921aa9272a3a3043182d0d50013117dde6ef62ad182", url = "https://nyc3.digitaloceanspaces.com/odva-marketplace/uploads/product/eds_file/2255/12040.08_EDS", terms = "none stated" }

# Points below are the connection the EDS names (Connection1, assemblies 1 and 2), all words 32-bit. Byte.bit are the protocol's
# 0-based offsets, worked out from the manual's 0-based DINT and Logic Bit columns.

[[points]]
name = "Normal Stop"
enip = "out:0.0"
meaning = "Logic Command bit 0: 1 = Normal Stop. A 0 must be present before Start, Jog or Run is accepted"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnotes (1) (2) (4)"

[[points]]
name = "Start"
enip = "out:0.1"
meaning = "Logic Command bit 1: 1 = Start, momentary"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnote (1)"

[[points]]
name = "Jog 1"
enip = "out:0.2"
meaning = "Logic Command bit 2: 1 = Jog 1 (speed set in 10:1894). A transition to 0 stops the drive"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnote (2)"

[[points]]
name = "Clear Fault"
enip = "out:0.3"
meaning = "Logic Command bit 3: 1 = Clear Fault; the value must switch from 0 to 1"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnote (3)"

[[points]]
name = "Direction"
enip = "out:0.4..out:0.5"
meaning = "Logic Command bits 4-5 (the table names both Unipolar Direction): 00 = no command, 01 = forward, 10 = reverse, 11 = hold direction control"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Manual"
enip = "out:0.6"
meaning = "Logic Command bit 6: 1 = Manual"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Accel Time"
enip = "out:1.0..out:1.1"
meaning = "Logic Command bits 8-9: 00 = no command, 01 = Accel Time 1 (10:1915), 10 = Accel Time 2 (10:1916), 11 = use present time"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Decel Time"
enip = "out:1.2..out:1.3"
meaning = "Logic Command bits 10-11: 00 = no command, 01 = Decel Time 1 (10:1917), 10 = Decel Time 2 (10:1918), 11 = use present time"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Ref Select"
enip = "out:1.4..out:1.6"
meaning = "Logic Command bits 12-14: 000 = no command, 001 = Ref A (10:1800), 010 = Ref B (10:1801), 011..111 = Preset 3..7 (10:1816..10:1820)"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
