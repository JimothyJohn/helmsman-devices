[[points]]
name = "Run"
enip = "out:2.2"
meaning = "Logic Command bit 18: 1 = Run. A 0 must be present on bit 0 first; a transition to 0 stops the drive"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 121 (printed 121), Table 99 (drive products), Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnote (4)"

[[points]]
