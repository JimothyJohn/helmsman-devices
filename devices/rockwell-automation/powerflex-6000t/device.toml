[[points]]
name = "Reference"
enip = "out:4:f32"
meaning = "Velocity reference, 32-bit REAL in Hz or RPM as set by drive 10:1891 (Velocity Units): 30.0 = 30.0 Hz. The commanded maximum cannot exceed 10:1392 (Max Speed Fwd). A negative value is a reverse command only in a bipolar direction mode"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 56 (printed 56), Table 6, DINT column (0-based), with a leading pad word on the input side from the EDS (Param100 Reserved): DINT n is bytes 4n..4n+3, low byte first (byte offset inferred), Output DINT 1; scaling PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 56-57 (printed 56-57), Table 7"

[[points]]
name = "DL From Net 01..16"
enip = "out:8:u32 .. out:68:u32"
meaning = "sixteen 32-bit words that write the drive parameters assigned in 0:321..0:336 (DL From Net 01..16); word n is out byte 8 + 4n. Each target is a DINT or a REAL as its own parameter says. Only as many as the output size covers (8 bytes = none, 72 = all 16). Not saved to nonvolatile memory"
source = "PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 56 (printed 56), Table 6, DINT column (0-based), with a leading pad word on the input side from the EDS (Param100 Reserved): DINT n is bytes 4n..4n+3, low byte first (byte offset inferred), Output DINT 2-17; PowerFlex 750-Series Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual 750COM-UM009B-EN-P (April 2021), PDF p. 57 (printed 57) Using Datalinks, PDF p. 55 (printed 55) for one 32-bit word per datalink"

