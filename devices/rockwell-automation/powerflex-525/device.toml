source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62, I/O Image table, 'Generic Profile' INT column (0-based INT; byte = 2 x INT, 16-bit little-endian, both inferred); datalink parameters PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 63"

