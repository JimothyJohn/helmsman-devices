# Drafted by scripts/eds-draft.py from the EDS alone. No unit has been checked:
# checked_on, firmware and checked_by stay out until one has, and every value
# below is what the vendor's file says, not what a device did.
[device]
vendor = "Rockwell Automation"
model = "PowerFlex 525 (embedded EtherNet/IP)"
kind = "drive"
category = "drive"
channels = "1 drive: logic command, reference, 4 datalinks out; logic status, feedback, 4 datalinks in"   # from: EDS Assem2 'Output' (Logic Command, Reference, DL Out 1-4) and Assem1 'Input' (Logic Status, Feedback, DL In 1-4)
article = "25B..."

[identity.enip]
vendor_id = 1
product_code = 9
device_type = 151
revisions = ["1.3"]   # the EDS's MajRev.MinRev
product_name = "PowerFlex 525"

[protocols.enip]
driver = "enip-io"
# from Connection1 "Discrete Exclusive Owner"
# input_assembly: the size is set by Param1: 8..16 bytes, default 8
input_assembly = { instance = 1 }
# output_assembly: the size is set by Param2: 4..12 bytes, default 4
output_assembly = { instance = 2 }
config_assembly = { instance = 6 }
eds = { name = "0001009700090100.eds", size = 18530, sha256 = "a02b3ea15a13f64b3c94a7c48de37877d2804eb5f09dc47225e57e68ba9bcab7", url = "https://nyc3.digitaloceanspaces.com/odva-marketplace/uploads/product/eds_file/580/11171_EDS.zip (member of 11171_EDS.zip)", terms = "none stated" }

[[points]]
name = "logic command: Normal Stop"
enip = "out:0.0"
meaning = "bit 0, 1 = Normal Stop; a 0 (Not Stop) must be present before Start or Jog takes effect. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Start"
enip = "out:0.1"
meaning = "bit 1, 1 = Start. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Jog 1"
enip = "out:0.2"
meaning = "bit 2, 1 = Jog; a transition to 0 stops the drive. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Clear Fault"
enip = "out:0.3"
meaning = "bit 3, 1 = Clear Fault; the value must switch from 0 to 1. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Unipolar Direction"
enip = "out:0.4..out:0.5"
meaning = "bits 4-5: 00 = no command, 01 = Forward, 10 = Reverse, 11 = no command. The speed reference cannot be negative: direction is set only here. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Keypad"
enip = "out:0.6"
meaning = "bit 6, 1 = Force Keypad Control. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: MOP Increment"
enip = "out:0.7"
meaning = "bit 7, 1 = MOP Increment. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Accel Time"
enip = "out:1.0..out:1.1"
meaning = "bits 8-9: 00 = no command, 01 = Accel Time 1 (P041), 10 = Accel Time 2 (A442), 11 = hold the rate selected. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Decel Time"
enip = "out:1.2..out:1.3"
meaning = "bits 10-11: 00 = no command, 01 = Decel Time 1 (P042), 10 = Decel Time 2 (A443), 11 = hold the rate selected. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: Ref Select"
enip = "out:1.4..out:1.6"
meaning = "bits 12-14 (Ref Select 1 is bit 12): 000 = no command, 001 = P047 Speed Reference1, 010 = P049 Speed Reference2, 011 = P051 Speed Reference3, 100 to 111 = A410 to A413 Preset Freq 0 to 3. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic command: MOP Decrement"
enip = "out:1.7"
meaning = "bit 15, 1 = MOP Decrement. Velocity mode (C122 = 0); with C122 = 1 (Position) the command bits are other, p. 154."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 153, Appendix D Logic Command Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at output INT 0 = bytes 0-1 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "reference"
enip = "out:2.0..out:3.7"
meaning = "speed reference, 16-bit value in units of 0.01 Hz (3000 = 30.00 Hz); the drive may override it (start source and speed reference parameters), and a negative value overflows to maximum speed."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62, I/O Image table, 'Generic Profile' INT column (0-based INT; byte = 2 x INT, 16-bit little-endian, both inferred); scaling PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 63"

[[points]]
name = "logic status: Run Ready"
enip = "in:4.0"
meaning = "bit 0, 1 = ready to run. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Active"
enip = "in:4.1"
meaning = "bit 1, 1 = active (running). Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Command Direction"
enip = "in:4.2"
meaning = "bit 2, 0 = reverse, 1 = forward. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Actual Direction"
enip = "in:4.3"
meaning = "bit 3, 0 = rotating reverse, 1 = rotating forward. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Accel"
enip = "in:4.4"
meaning = "bit 4, 1 = accelerating. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Decel"
enip = "in:4.5"
meaning = "bit 5, 1 = decelerating. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Fault"
enip = "in:4.7"
meaning = "bit 7, 1 = faulted (bit 6 is reserved). Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: At Speed"
enip = "in:5.0"
meaning = "bit 8, 1 = at reference. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Main Frequency"
enip = "in:5.1"
meaning = "bit 9, 1 = frequency reference controlled by the active comm. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Operation Command"
enip = "in:5.2"
meaning = "bit 10, 1 = start/stop controlled by the active comm. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Parameters"
enip = "in:5.3"
meaning = "bit 11, 1 = parameters locked. Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "logic status: Digital Input 1..4"
enip = "in:5.4..in:5.7"
meaning = "bits 12-15, the drive's digital inputs 1 to 4 (the manual gives no more). Velocity mode (C122 = 0); with C122 = 1 (Position) the status bits are other, p. 155."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 154, Appendix D Logic Status Word, Velocity Bit Definitions, 'Logic Bits' column (bit number 0-15, 0 at the right); byte.bit inferred: bit within the 16-bit word at Generic Profile input INT 2 = bytes 4-5 (PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62)"

[[points]]
name = "feedback"
enip = "in:6.0..in:7.7"
meaning = "speed feedback, 16-bit value in units of 0.01 Hz (5000 = 50.00 Hz)."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62, I/O Image table, 'Generic Profile' INT column (0-based INT; byte = 2 x INT, 16-bit little-endian, both inferred); scaling PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 63"

[[points]]
name = "pad words (not a signal)"
enip = "in:0.0..in:3.7"
meaning = "two pad words ahead of the logic status in the Generic Profile image; the EDS's 4-byte Reserved member (Param100) is the same."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62, I/O Image table, 'Generic Profile' INT column (0-based INT; byte = 2 x INT, 16-bit little-endian, both inferred); EDS Assem1 member Param100 'Reserved', 4 bytes"

[[points]]
name = "datalinks out 1..4"
enip = "out:4.0..out:11.7"
meaning = "one 16-bit word per enabled datalink, the target parameter chosen by C157..C160 [EN Data Out 1..4]; present only when the connection size includes them (output up to 12 bytes). Datalinks cannot be used with Multi-drive mode."
source = "PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 62, I/O Image table, 'Generic Profile' INT column (0-based INT; byte = 2 x INT, 16-bit little-endian, both inferred); datalink parameters PowerFlex 525 Embedded EtherNet/IP Adapter User Manual 520COM-UM001B-EN-E (March 2013) p. 63"

[[points]]
name = "datalinks in 1..4"
enip = "in:8.0..in:15.7"
