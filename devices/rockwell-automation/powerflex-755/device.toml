[[points]]
name = "Reference"
enip = "out:4:f32"
meaning = "Speed reference, 32-bit REAL in Hz or RPM as set by drive parameter 300 (Speed Units): 30.0 = 30.0 Hz. The commanded maximum cannot exceed parameter 520 (Max Fwd Speed). A negative value is a reverse command only in a bipolar direction mode"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 100 (printed 100), Table 4, Generic Profile Input column and Output column, DINT column (0-based): DINT n is bytes 4n..4n+3, low byte first (byte offset inferred), Output DINT 1; scaling PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 101-102 (printed 101-102), Table 5"

[[points]]
