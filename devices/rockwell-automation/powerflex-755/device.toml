# Drafted by scripts/eds-draft.py from the EDS; the [[points]] were then read by hand from the
# manual listed under [[sources]], page by page. No unit has been checked: checked_on, firmware
# and checked_by stay out until one has, and every value below is what the vendor's files say,
# not what a device did.
[device]
vendor = "Rockwell Automation"
model = "PowerFlex 755 (embedded EtherNet/IP)"
kind = "drive"
category = "drive"
channels = "1 drive: I/O connection of 8-72 bytes out and 12-76 bytes in (EDS gives sizes, no members)"   # from: EDS Param 'Output Size' 8-72, 'Input Size' 12-76; Connection 'Discrete Exclusive Owner'
article = "20G..."

[identity.enip]
vendor_id = 1
product_code = 2192
device_type = 143
revisions = ["16.1"]   # the EDS's MajRev.MinRev
product_name = "PowerFlex 755"

[protocols.enip]
driver = "enip-io"
# from Connection1 "Discrete Exclusive Owner"
# input_assembly: the size is set by Param2: 12..76 bytes, default 12
input_assembly = { instance = 1 }
# output_assembly: the size is set by Param1: 8..72 bytes, default 8
output_assembly = { instance = 2 }
config_assembly = { instance = 6 }
eds = { name = "0001008F08901000.eds", size = 6563, sha256 = "521e5178f12075fb7125af9d8a0558b7deb2c7c84d145d3772e9ce5242dda67c", url = "https://nyc3.digitaloceanspaces.com/odva-marketplace/uploads/product/eds_file/1644/10875.04.zip (member of 10875.04.zip)", terms = "none stated" }

# Points below are the connection the EDS names (Connection1, assemblies 1 and 2), all words 32-bit. Byte.bit are the protocol's
# 0-based offsets, worked out from the manual's 0-based DINT and Logic Bit columns.

[[points]]
name = "Normal Stop"
enip = "out:0.0"
meaning = "Logic Command bit 0: 1 = Normal Stop. A 0 must be present before Start, Jog or Run is accepted"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnotes (1) (2) (4)"

[[points]]
name = "Start"
enip = "out:0.1"
meaning = "Logic Command bit 1: 1 = Start, momentary"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnote (1)"

[[points]]
name = "Jog 1"
enip = "out:0.2"
meaning = "Logic Command bit 2: 1 = Jog 1 (speed set in parameter 556). A transition to 0 stops the drive"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnote (2)"

[[points]]
name = "Clear Fault"
enip = "out:0.3"
meaning = "Logic Command bit 3: 1 = Clear Fault; the value must switch from 0 to 1"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred); footnote (3)"

[[points]]
name = "Direction"
enip = "out:0.4..out:0.5"
meaning = "Logic Command bits 4-5 (the table names both Unipolar Direction): 00 = no command, 01 = forward, 10 = reverse, 11 = hold direction control"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Manual"
enip = "out:0.6"
meaning = "Logic Command bit 6: 1 = Manual"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Accel Time"
enip = "out:1.0..out:1.1"
meaning = "Logic Command bits 8-9: 00 = no command, 01 = Accel Time 1 (parameter 535), 10 = Accel Time 2 (parameter 536), 11 = use present time"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Decel Time"
enip = "out:1.2..out:1.3"
meaning = "Logic Command bits 10-11: 00 = no command, 01 = Decel Time 1 (parameter 537), 10 = Decel Time 2 (parameter 538), 11 = use present time"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
name = "Ref Select"
enip = "out:1.4..out:1.6"
meaning = "Logic Command bits 12-14: 000 = no command, 001 = Ref A (parameter 545), 010 = Ref B (parameter 550), 011..111 = Preset 3..7 (parameters 573..577)"
source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 195-196 (printed 195-196), Table 20, Logic Bit column (0-based); Logic Command is Output DINT 0 = out bytes 0-3; bit n is byte n/8, bit n%8 (inferred)"

[[points]]
