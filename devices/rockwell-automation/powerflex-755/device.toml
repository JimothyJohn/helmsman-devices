source = "PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 100 (printed 100), Table 4, Generic Profile Input column and Output column, DINT column (0-based): DINT n is bytes 4n..4n+3, low byte first (byte offset inferred), Output DINT 2-17; PowerFlex 755 Embedded EtherNet/IP Adapter User Manual 750COM-UM001G-EN-P (August 2018), PDF p. 94-95 (printed 94-95) for the size rule, PDF p. 102 (printed 102) Using Datalinks"

