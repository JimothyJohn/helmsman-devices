# Drafted by scripts/eds-draft.py from the EDS alone. No unit has been checked:
# checked_on, firmware and checked_by stay out until one has, and every value
# below is what the vendor's file says, not what a device did.
[device]
vendor = "Banner"
model = "DXMR90-4K"
kind = "remote-io"

[identity.enip]
vendor_id = 12
product_code = 200
device_type = 43
revisions = ["2.22"]   # the EDS's MajRev.MinRev
product_name = "Banner DXM"

[protocols.enip]
driver = "enip-io"
# from Connection1 "DXM Assemblies"
input_assembly = { instance = 100, bytes = 456 }   # bytes: manual p. 27, "DXM to Originator"
output_assembly = { instance = 112, bytes = 456 }   # bytes: manual p. 27, "Originator to DXM"
config_assembly = { instance = 128 }
eds = { name = "BannerDXM_1_1_02152023.eds", size = 6398, sha256 = "a2b91f84d761612222b31fcaa5819a62a8be9c66d209d671ee8479aa42601de4", url = "https://info.bannerengineering.com/_dav/cs/idcplg?IdcService=GET_FILE&RevisionSelectionMethod=LatestReleased&dDocName=B_4205242 (member of idcplg)", terms = "none stated" }

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# The manual (p. 5) says the DXMR90-4K is a Modbus TCP/IP server on port 502 by default and answers
# for its local registers; the register addresses are in the Device Register and IO-Link Data Reference Guide.

[[questions]]
ask = "The EDS is the DXM family's file (product name \"Banner DXM\", vendor 12, product code 200); does a DXMR90-4K answer ListIdentity with that name and code, or with its own?"
source = "DXMR90-4K manual p. 27 (\"ProdName: Banner DXM\") and the EDS BannerDXM_1_1_02152023.eds"

