# Written by hand from the documents below. No unit has been checked: checked_on,
# firmware and checked_by stay out until one has.
[device]
vendor = "Siemens"
model = "SENTRON PAC3200"
kind = "other"
category = "power-meter"
channels = "1 DI, 1 DO; voltage, current, power, energy, frequency, power factor, THD; 2-, 3- and 4-wire systems"   # from: SENTRON PAC3200 Manual A5E01168664B-04 (02/2008) p.19 (3.1 Features: one digital input and one digital output; two-, three- and four-wire systems), Table 3-3 p.24 (measured variables)
article = "7KM3200"

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# Default protocol is SEAbus TCP; Modbus TCP is selected in SETTINGS > COMMUNICATION > PROTOCOL and the device restarts (Manual p. 38-39).
# Device identification: FC 0x2B, objects Manufacturer, Manufacturer device name, Firmware version (Manual p. 62).

[[points]]
name = "Voltage Va-n"
modbus = "hr:0:f32 (offset 1, 2 registers, FC 0x03/0x04)"
meaning = "phase voltage a to neutral, float, V, read only"
source = "SENTRON PAC3200 Manual A5E01168664B-04 Table 3-6 p. 40; the zero-based address is inferred from offset 1, and so is the word order, which the pages read do not state"

[[points]]
name = "Current a"
modbus = "hr:12:f32 (offset 13, 2 registers, FC 0x03/0x04)"
meaning = "phase current a, float, A, read only"
source = "SENTRON PAC3200 Manual A5E01168664B-04 Table 3-6 p. 40; the zero-based address is inferred from offset 13, and so is the word order, which the pages read do not state"

[[points]]
name = "Frequency"
modbus = "hr:54:f32 (offset 55, 2 registers, FC 0x03/0x04)"
meaning = "line frequency, float, Hz, read only"
source = "SENTRON PAC3200 Manual A5E01168664B-04 Table 3-6 p. 41; the zero-based address is inferred from offset 55, and so is the word order, which the pages read do not state"

[[points]]
name = "Total Active Power"
modbus = "hr:64:f32 (offset 65, 2 registers, FC 0x03/0x04)"
meaning = "total active power, float, W, read only"
source = "SENTRON PAC3200 Manual A5E01168664B-04 Table 3-6 p. 41; the zero-based address is inferred from offset 65, and so is the word order, which the pages read do not state"

[[questions]]
ask = "Is the offset in Table 3-6 one-based (offset 1 is Modbus address 0, as 4X 40001 would be) and is the high or low word of a float first?"
source = "SENTRON PAC3200 Manual A5E01168664B-04 p. 40 (the table) and p. 38 (port 502): the pages read give neither"

[[sources]]
title = "SENTRON PAC3200 Manual A5E01168664B-04 (02/2008)"
sha256 = "b9efef1f28f8588d3f9b9ba04754e4914850fb0ec74373955d199d8f6b3de187"
