# Drafted by scripts/eds-draft.py from the EDS alone. No unit has been checked:
# checked_on, firmware and checked_by stay out until one has, and every value
# below is what the vendor's file says, not what a device did.
[device]
vendor = "SICK"
model = "SIG350"
kind = "remote-io"
category = "iolink-master"
channels = "8 IO-Link ports, each configurable as IO-Link, DI or DO"   # from: EDS Params 'IO-Link Port S1..S8 - Port Mode' (IOL Manual, IOL Autostart, Digital Input, Digital Output)
article = "SIG350-0005AP100"

[identity.enip]
vendor_id = 808
product_code = 16642
device_type = 12
revisions = ["1.1"]   # the EDS's MajRev.MinRev
product_name = "SIG350"

[protocols.enip]
driver = "enip-io"
# from Connection1 "Exclusive Owner - 32 bytes per IO-Link Port"
# instances are the defaults of Param2, Param1: the EDS lets a scanner choose others
# input_assembly: the size is set by Param151: 4..276 bytes, default 276
input_assembly = { instance = 101 }
# output_assembly: the size is set by Param150: 4..276 bytes, default 276
output_assembly = { instance = 100 }
config_assembly = { instance = 102, bytes = 130 }
