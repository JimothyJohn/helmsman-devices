[device]
vendor = "Moxa"
model = "ioLogik E1260"
kind = "remote-io"
channels = "6 RTD"
profile = "moxa-iologik-e1260.device"   # the device profile a controller copies into a project (helmsman-device 1)
# No unit of this model has been checked: checked_on, firmware and checked_by are
# left out until one has. Every fact here is from the documents under [[sources]].

[protocols.modbus]
driver = "modbus-tcp"
map = "modbus.map"
port = 502
unit = 1

# EtherNet/IP: the unit speaks it (firmware 2.5 or later, manual p. 5-1) and the manual gives
# the bytes (the enip lines under [[points]]), but this model's EDS has not been read, so
# the product code and the connection are not recorded and the profile is Modbus only.

[[points]]
name = "RTD-00..RTD-05 engineering value x 10"
enip = "in:0:u16 .. in:10:u16 (UINT at byte 2n, little-endian)"
modbus = "ir:1536:i16 .. ir:1541:i16"
meaning = "the measured value times ten, in the unit the channel is set to (the manual: 'Unit: 0.1'); one word a channel"
source = "E1200 manual v15.10 p. A-16, p. B-2; channel n at 1536 + n, and a value below zero as two's complement, are inferred"

