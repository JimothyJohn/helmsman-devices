[device]
vendor = "Moxa"
model = "ioLogik E1210"
kind = "remote-io"
channels = "16 DI"
profile = "moxa-iologik-e1210.device"   # the device profile a controller copies into a project (helmsman-device 1)
# No unit of this model has been checked: checked_on, firmware and checked_by are
# left out until one has. Every fact here is from the documents under [[sources]].

[protocols.modbus]
driver = "modbus-tcp"
map = "modbus.map"
port = 502
unit = 1

# EtherNet/IP: the unit speaks it (firmware 2.5 or later, manual p. 5-1) and the manual gives
# the bytes (the enip lines under [[points]]), but this model's EDS has not been read, so
# the product code and the connection are not recorded and the profile is Modbus only.

[[points]]
name = "DI-00..DI-15"
enip = "di:0..di:15 (input bytes 0-1, bit n = channel n)"
modbus = "di:0..di:15; ir:48 = all of them as one word"
meaning = "digital input state, 1 = on"
source = "E1200 manual v15.10 p. A-2, p. B-1; bit n = channel n as confirmed on the E1213 (bench 2026-11-02), not on this model"

[[points]]
name = "DI counters"
enip = "in:2:u32 .. in:62:u32 (UDINT at byte 2 + 4n, little-endian)"
modbus = "ir:16:u32 .. ir:46:u32 (two words a channel, high word first)"
meaning = "counter mode value; a channel in DI mode (the factory default) does not count"
source = "E1200 manual v15.10 p. A-2, p. B-1, Appendix E; counter n at 16 + 2n and at byte 2 + 4n is inferred"

