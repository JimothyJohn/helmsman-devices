[device]
vendor = "Moxa"
model = "ioLogik E1262"
kind = "remote-io"
channels = "8 TC"
profile = "moxa-iologik-e1262.device"   # the device profile a controller copies into a project (helmsman-device 1)
# No unit of this model has been checked: checked_on, firmware and checked_by are
# left out until one has. Every fact here is from the documents under [[sources]].

[protocols.modbus]
driver = "modbus-tcp"
map = "modbus.map"
port = 502
unit = 1

# EtherNet/IP: the unit speaks it (firmware 2.5 or later, manual p. 5-1) and the manual gives
# the bytes (the enip lines under [[points]]), but this model's EDS has not been read, so
# the product code and the connection are not recorded and the profile is Modbus only.

[[points]]
name = "TC-00..TC-07 engineering value x 10"
enip = "in:0:u32 .. in:28:u32 (UDINT at byte 4n, little-endian)"
modbus = "ir:2048:i32 .. ir:2062:i32 (two words a channel, high word first)"
meaning = "the measured value times ten in Celsius or Fahrenheit, or in units of 0.0001 mV when the channel measures millivolts"
source = "E1200 manual v15.10 p. A-18, p. B-2; channel n at 2048 + 2n, and a value below zero as two's complement, are inferred"

