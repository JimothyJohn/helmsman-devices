[device]
vendor = "Moxa"
model = "ioLogik E1241"
kind = "remote-io"
channels = "4 AO"
profile = "moxa-iologik-e1241.device"   # the device profile a controller copies into a project (helmsman-device 1)
# No unit of this model has been checked: checked_on, firmware and checked_by are
# left out until one has. Every fact here is from the documents under [[sources]].

[protocols.modbus]
driver = "modbus-tcp"
map = "modbus.map"
port = 502
unit = 1

# EtherNet/IP: the unit speaks it (firmware 2.5 or later, manual p. 5-1) and the manual gives
# the bytes (the enip lines under [[points]]), but this model's EDS has not been read, so
# the product code and the connection are not recorded and the profile is Modbus only.

[[points]]
name = "AO-00..AO-03 raw value"
enip = "out:0:u16 .. out:6:u16 (UINT at byte 2n of the output assembly, little-endian); the same 8 bytes read back in the input assembly"
modbus = "hr:1024..hr:1027"
meaning = "the converter's raw value, 0..4095 (the range of the Safe Mode value, p. 3-21); what a count is in volts or mA depends on the channel's mode"
source = "E1200 manual v15.10 p. A-12, p. B-1, p. B-2; channel n at 1024 + n and at byte 2n is inferred"

