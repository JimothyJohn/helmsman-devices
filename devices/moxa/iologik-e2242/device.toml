[[questions]]
ask = "Which unit id does the Modbus TCP server answer to? The manual's address tables give none, and the one unit id text (p. 26: RS-485 Unit ID 1, up to 247) is about the serial port."
source = "E2200 manual v7.2, Appendix I (pp. 166-235) and the serial port notes"

[[questions]]
ask = "What do the AI words at ir:24..ir:27 hold: raw ADC counts, or a value scaled to the channel's range? The table says 'Read AI Value' and gives no formula; the manual's scaling registers (hr:284..hr:311) suggest a raw reading plus an optional float."
source = "E2200 manual v7.2 p. 220, p. 226-227"
