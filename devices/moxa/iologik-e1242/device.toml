[device]
vendor = "Moxa"
model = "ioLogik E1242"
kind = "remote-io"
channels = "4 AI, 4 DI, 4 DIO"
profile = "moxa-iologik-e1242.device"   # the device profile a controller copies into a project (helmsman-device 1)
# No unit of this model has been checked: checked_on, firmware and checked_by are
# left out until one has. Every fact here is from the documents under [[sources]].

[protocols.modbus]
driver = "modbus-tcp"
map = "modbus.map"
port = 502
unit = 1

# EtherNet/IP: the unit speaks it (firmware 2.5 or later, manual p. 5-1) and the manual gives
# the bytes (the enip lines under [[points]]), but this model's EDS has not been read, so
# the product code and the connection are not recorded and the profile is Modbus only.

[[points]]
name = "DI-00..DI-07"
enip = "di:0..di:7 (input byte 0, bit n = channel n)"
modbus = "di:0..di:7; ir:48 = all of them as one word"
meaning = "digital input state, 1 = on"
source = "E1200 manual v15.10 p. A-14, p. B-1; bit n = channel n as confirmed on the E1213 (bench 2026-11-02), not on this model"

[[points]]
name = "DI counters"
enip = "in:1:u32 .. in:29:u32 (UDINT at byte 1 + 4n, little-endian)"
modbus = "ir:16:u32 .. ir:30:u32 (two words a channel, high word first)"
meaning = "counter mode value; a channel in DI mode (the factory default) does not count"
source = "E1200 manual v15.10 p. A-14, p. B-1, Appendix E; counter n at 16 + 2n and at byte 1 + 4n is inferred"

[[points]]
name = "DO-00..DO-03"
enip = "do:0..do:3 (output byte 0, bit n = channel n); status in input byte 33"
modbus = "coil:0..coil:3; hr:32 = all of them as one word"
meaning = "digital output command and state, 1 = on"
source = "E1200 manual v15.10 p. A-15, p. B-1, p. B-2; bit n = channel n as confirmed on the E1213 (bench 2026-11-02), not on this model"

[[points]]
name = "AI-00..AI-03 raw value"
enip = "in:34:u16 .. in:40:u16 (UINT at byte 34 + 2n, little-endian)"
modbus = "ir:512..ir:515"
meaning = "the converter's raw value, one word a channel; what a count is in volts or mA depends on the channel's mode and jumper"
source = "E1200 manual v15.10 p. A-14, p. B-1; channel n at 512 + n and at byte 34 + 2n is inferred"

[[points]]
name = "AI-00..AI-03 status"
modbus = "ir:576..ir:579"
meaning = "0 normal, 1 burnout, 2 over range, 3 under range"
source = "E1200 manual v15.10 p. A-14"

