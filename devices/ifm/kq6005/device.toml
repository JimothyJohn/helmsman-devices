# Drafted by scripts/iodd-draft.py from the IODD alone. No unit has been checked:
# checked_on and checked_by stay out until one has, and every value below is
# what the vendor's file says, not what a device did.
[device]
vendor = "ifm"
model = "KQxxxx"
# kind: inputs make a sensor, outputs alone an actuator; the IODD does not say. Change it if wrong.
kind = "sensor"
category = "sensor"
channels = "1 switch state (OUT1), 1 process value"   # from: the entry's IODD signals ('Switch state [OUT1]', 'Process value'), IODD ifm-000173-20260420-IODD1.1.xml
family = "KQ"
vendor_url = "www.ifm.com/ifmgb/web/io-link_down.htm"

[device.photo]
url = "https://media.ifm.com/dam/019ef139-0207-7a00-810e-f81967f41ce6/original%2Cf_avif%2Cw_576%2Ch_576%2Cbc_white/KQ6005.avif"
