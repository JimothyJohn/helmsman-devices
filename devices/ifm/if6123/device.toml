# The device on plain digital channels, with no IO-Link master.
[wired]
sio = true   # it switches its C/Q wire on its own (SIO mode)
# Which signal the switching wire carries is not in an IODD: read it from the manual,
# then add: switching = "<signal name>", source = "<manual, page>"

[[wired.connections]]
type = "Other"
