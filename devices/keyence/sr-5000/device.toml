# below is what the vendor's file says, not what a device did.
[device]
vendor = "Keyence"
model = "SR-5000 Series"
kind = "sensor"
category = "vision"
channels = "1 reader: read, preset and tune requests out, read result data, status and counts in"   # from: EDS Assem100/Assem101 member names (Read Request, Preset Request, Tune Request; Result Data, Read Complete, Result Data Size)
article = "SR-5000"

[identity.enip]
vendor_id = 367
product_code = 1008
device_type = 43
