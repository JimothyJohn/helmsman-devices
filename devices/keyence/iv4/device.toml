# Drafted by scripts/eds-draft.py from the EDS alone. No unit has been checked:
# checked_on, firmware and checked_by stay out until one has, and every value
# below is what the vendor's file says, not what a device did.
[device]
vendor = "Keyence"
model = "IV4 Series"
kind = "sensor"
category = "vision"
channels = "1 vision sensor: external input out, monitor data in"   # from: EDS Assem100-103 'Input Assembly' 1400 B (Monitor Data Size Default/4XDetailed/8XDetailed/Simple), Assem110 'Output Assembly' 104 B, 'External Input Size'
article = "IV4 Series"

[identity.enip]
vendor_id = 367
product_code = 4607
device_type = 43
revisions = ["1.1"]   # the EDS's MajRev.MinRev
product_name = "IV4 Series"

[protocols.enip]
driver = "enip-io"
# from Connection1 "Default Monitor Data And External Input"
# input_assembly: the size is set by Param10100: 2..1400 bytes, default 394
input_assembly = { instance = 100 }
# output_assembly: the size is set by Param10110: 2..104 bytes, default 12
output_assembly = { instance = 110 }
config_assembly = { instance = 1 }
