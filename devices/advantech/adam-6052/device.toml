# Written by hand from the manual. No unit has been checked: checked_on,
# firmware and checked_by stay out until one has.
[device]
vendor = "Advantech"
model = "ADAM-6052"
kind = "remote-io"
category = "panel-io"
channels = "8 DI, 8 DO (source type)"

[device.photo]
url = "https://advdownload.advantech.com/productfile/PIS/ADAM-6052/Product%20-%20Photo(Main)/ADAM-6052_03_S20190725161934.jpg"
page = "https://buy.advantech.com/I-O-Devices-Communication/Remote-I-O-Modules-Ethernet-I-O-Modules-EtherNet-IP-Modules/model-ADAM-6052-D.htm"
seen = 2026-11-16

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# The unit id is not stated in the manual pages read.

[[points]]
name = "DI"
modbus = "coil:0..coil:7 (0X 00001-00008, FC 1, read only)"
meaning = "digital input state, 1 = on"
source = "ADAM-6000 User Manual Ed. 12 p. 213"

[[points]]
name = "DO"
modbus = "coil:16..coil:23 (0X 00017-00024, R/W)"
meaning = "digital output command and state, 1 = on"
source = "ADAM-6000 User Manual Ed. 12 p. 213"

[[points]]
name = "DI counters"
modbus = "hr:0:u32 .. hr:14:u32 (4X 40001-, two words a channel, LOW word first)"
meaning = "counter value in counter mode; frequency = low word / 10 Hz in frequency mode"
source = "ADAM-6000 User Manual Ed. 12 p. 215; 'Counter = (40002) x 65536 + (40001)'"

[[points]]
name = "module name"
modbus = "hr:210 (4X 40211), read"
meaning = "the model as hex, e.g. 0x6050: a cheap identity check"
source = "ADAM-6000 User Manual Ed. 12 p. 208, remark 7"

