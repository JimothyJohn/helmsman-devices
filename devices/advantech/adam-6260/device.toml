# Written by hand from the manual. No unit has been checked: checked_on,
# firmware and checked_by stay out until one has.
[device]
vendor = "Advantech"
model = "ADAM-6260"
kind = "remote-io"
channels = "6 relay DO (5 Form C, 1 Form A)"

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# The unit id is not stated in the manual pages read.

[[points]]
name = "relay DO"
modbus = "coil:16..coil:21 (0X 00017-00022, R/W)"
meaning = "relay output command and state, 1 = on"
source = "ADAM-6200 User Manual Ed. 5 p. 146"

[[points]]
name = "pulse output widths and counts"
modbus = "hr:0..hr:47 (4X 40001-40048: low-level width, high-level width, absolute pulse, incremental pulse, two words a channel each)"
meaning = "pulse output timing and count per relay"
source = "ADAM-6200 User Manual Ed. 5 p. 146-147"

[[points]]
name = "DO as one word"
modbus = "hr:302 (4X 40303, R/W)"
meaning = "all relays in one register"
source = "ADAM-6200 User Manual Ed. 5 p. 147"

[[sources]]
title = "ADAM-6200 Series Intelligent Ethernet I/O Module User Manual, Edition 5 (Part No. 2003620004)"
