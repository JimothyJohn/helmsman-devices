# Written by hand from the manual. No unit has been checked: checked_on,
# firmware and checked_by stay out until one has.
[device]
vendor = "Brainboxes"
model = "ED-538"
kind = "remote-io"
category = "panel-io"
channels = "8 DI, 4 DO"

[device.photo]
url = "https://www.brainboxes.com/wp-content/uploads/2021/10/brainboxes-ed-538-4-form-a-relays-8-digital-inputs-and-an-ascii-gateway.jpg"
page = "https://www.brainboxes.com/product/remote-io/digital/ed-538"
seen = 2026-11-16

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# Ships speaking Brainboxes ASCII: Modbus TCP must be chosen on the web console's protocol page (http://ADDR/#/protocol) first. Port 502, idle timeout 0, 8 connections by default (Modbus TCP Manual p. 3).

[[points]]
name = "DI"
modbus = "di:0..di:7 (FC 2); also coil:32..coil:39 (FC 1); ir:32 = all eight"
meaning = "digital input state, 1 = on"
source = "Brainboxes Modbus TCP Manual §9.3 p. 7"

[[points]]
name = "DO"
modbus = "coil:0..coil:3 (FC 1, 5, 15); hr:32 = all 4 as one word (FC 3, 6, 16)"
meaning = "digital output command and state, 1 = on"
source = "Brainboxes Modbus TCP Manual §9.3 p. 7; the worked example (p. 8) writes output 1 at coil 0x0001, the table says 0x0000: unresolved"

[[points]]
name = "DI counters"
modbus = "ir:0..ir:7 or hr:0..hr:7; clear with coil:512..coil:519"
meaning = "pulse count per input"
source = "Brainboxes Modbus TCP Manual §9.3 p. 7"

[[points]]
name = "output overload"
modbus = "di:1024..di:1027 (FC 2); ir:1024 = all"
meaning = "1 = that output is overloaded"
source = "Brainboxes Modbus TCP Manual §9.3 p. 7"

