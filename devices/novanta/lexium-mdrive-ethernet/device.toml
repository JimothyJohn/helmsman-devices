# Drafted by scripts/eds-draft.py from the EDS alone. No unit has been checked:
# checked_on, firmware and checked_by stay out until one has, and every value
# below is what the vendor's file says, not what a device did.
[device]
vendor = "Novanta IMS"
model = "Liberty / Lexium MDrive Ethernet (LMD), EtherNet/IP"
kind = "drive"

[identity.enip]
vendor_id = 243
product_code = 15362
device_type = 43
revisions = ["2.22"]   # the EDS's MajRev.MinRev
product_name = "MDrive"

[protocols.enip]
driver = "enip-io"
# from Connection1 "Exclusive Owner"
input_assembly = { instance = 100, bytes = 16 }
output_assembly = { instance = 112, bytes = 36 }   # EDS Assem112 and Fieldbus manual p. 33; the manual's table on p. 20 adds up to 34, see questions
config_assembly = { instance = 1, bytes = 0 }   # Fieldbus manual p. 33: configuration instance 1, size 0
eds = { name = "SEM_MDrivever1_2.eds", size = 24813, sha256 = "b14f0fe268df5b37e9dcee6bd0288a88e59d428dbe6044b49dba8beaaeb86041", url = "https://www.novantaims.com/download/lmd-ethernet-tcp-ip-application-2-4-0-9/?wpdmdl=33950&refresh=6afbcc0d386a61794886669 (member of lmd-ethernet-tcp-ip-application-2-4-0-9)", terms = "none stated" }

