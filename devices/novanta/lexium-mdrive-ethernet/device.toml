[[points]]
name = "Input assembly 100, moving flag"
enip = "in:0.1"
meaning = "byte 0 bit 1 MV, 1 while the axis moves"
source = "EDS Param1 enum (MV bit 1); Fieldbus manual p. 20; confirmed on a unit 2026-11-16 (it followed PR MV through a slew and a stop)"

[[points]]
name = "Input assembly 100, bit 0 and the inputs"
enip = "in:0.0, in:1:u8"
meaning = "byte 0 bit 0 EF (error flag) by the documents; byte 1 IN (the digital inputs as a group, bit 0 = input 1). On the bench unit bit 0 followed the drive enable (1 with DE=1) while PR EF read 0, and byte 1 read 0x0F like PR IN (15)"
source = "EDS Param1 enum (EF bit 0, Input0..7 bits 8-15 of a 32-bit word); Fieldbus manual p. 20; a unit 2026-11-16"

[[points]]
name = "Input assembly 100, position"
enip = "in:4:i32"
meaning = "bytes 4-7 C1 position counter (DINT, motor steps, little-endian)"
source = "EDS Assem100 (Param2); Fieldbus manual p. 20; MCode reference C1 p. 44; confirmed on a unit 2026-11-16 (equal to PR P at rest and through a slew at 5000 steps/s)"

[[points]]
name = "Input assembly 100, bytes 8-11"
enip = "in:8:i32"
meaning = "C2 encoder counter (DINT) by the documents. On the bench unit these bytes held the error code instead: 30, 94, 107 and 25 were read there, each equal to PR ER at the time, while PR C2 read 111798"
source = "EDS Assem100 (Param3); Fieldbus manual p. 20; MCode reference C2 p. 45; a unit 2026-11-16"

[[points]]
name = "Input assembly 100, bytes 12-15"
enip = "in:0.12..in:0.15"
meaning = "EDS: V, velocity (DINT). Fieldbus manual: LL, lead/lag (DINT). The two documents disagree, see questions"
source = "EDS Param4; Fieldbus manual p. 20"

[[points]]
name = "Output assembly 112, motion setup (documents only; a unit did otherwise)"
enip = "out:0.0..out:0.15"
meaning = "A acceleration (UDINT, steps/s^2, default 1000000), D deceleration (UDINT), MA move to absolute position (DINT, steps), MR move by relative position (DINT, steps), in that order, 4 bytes each"
source = "EDS Assem112 and Fieldbus manual p. 20; defaults MCode reference A p. 33, D p. 50"

[[points]]
name = "Output assembly 112, currents and outputs (documents only; a unit did otherwise)"
enip = "out:0.16..out:0.19"
meaning = "byte 16 RC run current percent, byte 17 HC hold current percent, byte 18 OT digital outputs, byte 19 pad"
source = "EDS Assem112 and Fieldbus manual p. 20"

[[points]]
name = "Output assembly 112, slew"
enip = "out:20:i32"
meaning = "SL slew (DINT, steps/s): a change of the value starts a constant-velocity move, 0 stops it"
source = "EDS Assem112 and Fieldbus manual p. 20; the slew and stop example Fieldbus manual p. 39-40; confirmed on a unit 2026-11-16 (5000 gave PR V 5000 and 5000 steps/s of position, 0 stopped; the drive had to be enabled)"

[[points]]
name = "Output assembly 112, initial and maximum velocity (documents only)"
enip = "out:24:u32, out:28:u32"
meaning = "VI initial velocity (UDINT, default 1000), VM maximum velocity (UDINT, default 768000)"
source = "EDS Assem112 and Fieldbus manual p. 20; defaults MCode reference MS p. 88, VM p. 119"

[wiring]
note = "Default IP 192.168.33.1. Application protocol must be set to EtherNet/IP before the device is put on a network (factory default is MODBUS/TCP), with the LMD Software Suite's TCP/IP Configuration Utility."
source = "LMDxE57-85C product manual V1.00 p. 63 (7.1); Fieldbus manual pp. 16, 33"

[[questions]]
ask = "How many bytes does output assembly 112 have on a unit, 36 (EDS, RSLogix example) or 34 (the sum of the manual's table, which ends TQ, EF as one byte each where the EDS has TE as 4 bytes)? What are bytes 32-35?"
source = "Fieldbus manual p. 20 (table) and p. 33, 38 (36 bytes); EDS Assem112"

[[questions]]
ask = "Do bytes 12-15 of input assembly 100 hold V (velocity, EDS) or LL (lead/lag, manual p. 20)?"
source = "EDS Assem100 Param4; Fieldbus manual p. 20"

[[questions]]
ask = "Does a unit as delivered follow the documents' layout for output assembly 112? The bench unit's mapping had been changed in the TCP/IP Configuration Utility to P, MF, VM, ER, CF, DE, RC, pad, SL, LG, MA, RD, AS, toggle bits (the utility's E.I.P. page, its owner's photo 2026-11-17), and every field the bench exercised agreed with that page (P, DE, RC, SL, and the whole input assembly as DE, MV, IN, P, ER, LL). So the manual's table (A, D, MA, MR, RC, HC, OT, pad, SL, VI, VM) has not been checked on any unit."
source = "Fieldbus manual p. 20 (the table and its note); a unit 2026-11-16, one field changed at a time and read back over MCode/TCP; the Configuration Utility's E.I.P. page for that unit, 2026-11-17"

[[questions]]
ask = "What stops the motor when the I/O connection is lost? On the bench unit a slew went on for more than 10 s after the controller stopped sending (it stopped on a Forward_Close and on the run/idle header going to idle), although the Configuration Utility's E.I.P. page showed 'I/O Implicit connection tests: Halt Motion On' for it. Whether that value had been read from the drive, and what the setting covers, is not known."
source = "Fieldbus manual p. 44 (the NS LED only); a unit 2026-11-16"
