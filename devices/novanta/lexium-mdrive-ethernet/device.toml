# Drafted from the EDS and the manuals, then held against one unit (README.md,
# "On the bench"): the identity, the assemblies' sizes and the connection are
# what that unit did. Its assembly mapping had been changed from the default
# (its owner, 2026-11-17), so its output bytes did not follow the documents'
# layout; the output points below are the documents' and are marked as such.
[device]
vendor = "Novanta IMS"
model = "Liberty / Lexium MDrive Ethernet (LMD), EtherNet/IP"
kind = "drive"
category = "drive"
checked_on = "2026-11-16"
firmware = "LMDCM 6.013, Hw: 2.10 (identity revision 2.36)"
checked_by = "helmsman bench"

[device.photo]
# a NEMA 23 (LM57) unit: Novanta has no NEMA 34 page; the bench unit is an LMDCE853C
url = "https://www.novantaims.com/wp-content/uploads/2017/01/lmd23_right_facing_hirez-738x1024.jpg"
page = "https://www.novantaims.com/liberty-mdrives/lm57-nema-23-ethernet-tcpip-ip20-lmoe57/"
seen = 2026-11-21

[identity.enip]
vendor_id = 243
product_code = 15362
device_type = 43
revisions = ["2.22", "2.36"]   # 2.22: the EDS's MajRev.MinRev; 2.36: a unit 2026-11-16
product_name = "MDrive"

[protocols.enip]
driver = "enip-io"
# from Connection1 "Exclusive Owner"
input_assembly = { instance = 100, bytes = 16 }
output_assembly = { instance = 112, bytes = 36 }   # EDS Assem112 and Fieldbus manual p. 33; the manual's table on p. 20 adds up to 34, see questions
config_assembly = { instance = 1, bytes = 0 }   # Fieldbus manual p. 33: configuration instance 1, size 0
# On a unit (2026-11-16): O->T carries the 32-bit run/idle header although the
# EDS declares it modeless (a Forward_Open at the EDS's size is refused 0x0127
# with the size it wants, 42); T->O has none. It grants any RPI from 1 ms to
# 500 ms and then sends about 1.3 to 1.5 times slower than granted. Inputs go to
# UDP 2222 whatever the Forward_Open names. It resets the TCP session 2 to 3 s
# after the Forward_Open and keeps exchanging I/O.
rpi_ms = { min = 1, default = 20 }   # 1..500 ms accepted by a unit; 20 is the manual's example (p. 33)
eds = { name = "SEM_MDrivever1_2.eds", size = 24813, sha256 = "b14f0fe268df5b37e9dcee6bd0288a88e59d428dbe6044b49dba8beaaeb86041", url = "https://www.novantaims.com/download/lmd-ethernet-tcp-ip-application-2-4-0-9/?wpdmdl=33950&refresh=6afbcc0d386a61794886669 (member of lmd-ethernet-tcp-ip-application-2-4-0-9)", terms = "none stated" }

