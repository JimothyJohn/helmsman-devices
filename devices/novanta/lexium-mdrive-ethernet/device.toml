[[points]]
name = "Input assembly 100, status flags"
enip = "in:0.0..in:0.1"
meaning = "byte 0 bit 0 EF (error flag), bit 1 MV (moving flag); byte 1 IN (the digital inputs as a group, bit 0 = input 1)"
source = "EDS Param1 enum (EF bit 0, MV bit 1, Input0..7 bits 8-15 of a 32-bit word); Fieldbus manual p. 20"

[[points]]
name = "Input assembly 100, counters"
enip = "in:0.4..in:0.11"
meaning = "bytes 4-7 C1 position counter (DINT, motor steps), bytes 8-11 C2 encoder counter (DINT, encoder counts); little-endian is inferred (CIP)"
source = "EDS Assem100 (Param2, Param3, 32 bits each in order after the 4-byte flags word); Fieldbus manual p. 20; MCode reference C1 p. 44, C2 p. 45"

[[points]]
name = "Input assembly 100, bytes 12-15"
enip = "in:0.12..in:0.15"
meaning = "EDS: V, velocity (DINT). Fieldbus manual: LL, lead/lag (DINT). The two documents disagree, see questions"
source = "EDS Param4; Fieldbus manual p. 20"

[[points]]
name = "Output assembly 112, motion setup"
enip = "out:0.0..out:0.15"
meaning = "A acceleration (UDINT, steps/s^2, default 1000000), D deceleration (UDINT), MA move to absolute position (DINT, steps), MR move by relative position (DINT, steps), in that order, 4 bytes each"
source = "EDS Assem112 and Fieldbus manual p. 20; defaults MCode reference A p. 33, D p. 50"

[[points]]
name = "Output assembly 112, currents and outputs"
enip = "out:0.16..out:0.19"
meaning = "byte 16 RC run current percent, byte 17 HC hold current percent, byte 18 OT digital outputs, byte 19 pad"
source = "EDS Assem112 and Fieldbus manual p. 20"

[[points]]
name = "Output assembly 112, velocities"
enip = "out:0.20..out:0.31"
meaning = "SL slew (DINT, steps/s, a write starts a constant-velocity move, 0 stops it), VI initial velocity (UDINT, default 1000), VM maximum velocity (UDINT, default 768000)"
source = "EDS Assem112 and Fieldbus manual p. 20; the slew and stop example Fieldbus manual p. 39-40; defaults MCode reference MS p. 88, VM p. 119"

[wiring]
note = "Default IP 192.168.33.1. Application protocol must be set to EtherNet/IP before the device is put on a network (factory default is MODBUS/TCP), with the LMD Software Suite's TCP/IP Configuration Utility."
source = "LMDxE57-85C product manual V1.00 p. 63 (7.1); Fieldbus manual pp. 16, 33"

[[questions]]
ask = "How many bytes does output assembly 112 have on a unit, 36 (EDS, RSLogix example) or 34 (the sum of the manual's table, which ends TQ, EF as one byte each where the EDS has TE as 4 bytes)? What are bytes 32-35?"
source = "Fieldbus manual p. 20 (table) and p. 33, 38 (36 bytes); EDS Assem112"

[[questions]]
ask = "Do bytes 12-15 of input assembly 100 hold V (velocity, EDS) or LL (lead/lag, manual p. 20)?"
source = "EDS Assem100 Param4; Fieldbus manual p. 20"

[[questions]]
ask = "Does the device report revision 2.22 as the manual and EDS say, or something later (the EDS is dated 2012 and ships in the 2.4.0.9 package)? A ListIdentity of 2.36 was seen on a bench unit."
source = "EDS [Device] MajRev 2 MinRev 22; Fieldbus manual p. 18"

[[questions]]
ask = "Which real-time transfer format does each connection use: the EDS gives O->T format 0 (modeless) for the exclusive owner and format 3 (heartbeat) for listen-only and input-only; is there a 32-bit run/idle header on the exclusive-owner O->T data? The manual does not say."
source = "EDS Connection1..3 (trigger/transport words 0x84010002, 0x01010002, 0x02010002; format words 0x00440005, 0x00440305, 0x00440305)"

[[questions]]
ask = "What does the motor do when the I/O connection times out or the controller goes to idle? The manual says only that the NS LED flashes red and nothing about motion."
source = "Fieldbus manual p. 44; LMDE57-85IP hardware manual p. 35"

[[questions]]
ask = "The Fieldbus manual calls the device a Generic Device with device type 0h (p. 13) yet its identity table and the EDS say 43 (0x2B). Which does the unit answer?"
source = "Fieldbus manual p. 13 and p. 18; EDS ProdType"
