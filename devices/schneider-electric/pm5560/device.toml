# Written by hand from the documents below. No unit has been checked: checked_on,
# firmware and checked_by stay out until one has.
[device]
vendor = "Schneider Electric"
model = "PowerLogic PM5560"
kind = "other"
category = "power-meter"
article = "METSEPM5560"

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# TCP port 502 is the gateway port (User Manual HRB1684301-18 p. 126). The unit id is not stated in the pages read.

[[questions]]
ask = "The user manual says the PM5560 is ODVA-certified for EtherNet/IP (p. 18) but ships no EDS and no assembly list in the pages read: what identity and assemblies does it report, and where is the EDS?"
source = "PM5500 / PM5600 / PM5700 User Manual HRB1684301-18 p. 18"
