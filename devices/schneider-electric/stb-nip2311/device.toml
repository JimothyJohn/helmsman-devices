# Written by hand from the documents below. No unit has been checked: checked_on,
# firmware and checked_by stay out until one has.
[device]
vendor = "Schneider Electric"
model = "Modicon STB NIP2311"
kind = "remote-io"
category = "io-coupler"

[protocols.modbus]
driver = "modbus-tcp"
port = 502
# Port 502 is the Modbus TCP service of the NIM (Applications Guide p. 117). The unit id is not stated in the pages read.

[[points]]
name = "island output data"
modbus = "hr:0.. (4X 40001-, R/W)"
meaning = "data written to the island's output modules: one register for each digital output module, two for an analog output module, in island-bus order"
source = "STBNIP2311 Applications Guide EIO0000000051.05 p. 119 (register numbers); the zero-based form hr:0 is inferred from 40001"

[[points]]
name = "island input data and I/O status"
modbus = "hr:5391.. (4X 45392-, read)"
meaning = "input data and status of the island's I/O modules in island-bus order: a digital input module uses one register for data and the next for status; a digital output module reports its echo output and then its status"
source = "STBNIP2311 Applications Guide EIO0000000051.05 p. 120; the zero-based form hr:5391 is inferred from 45392"

[[points]]
name = "island diagnostics"
modbus = "hr:5356..hr:5390 (4X 45357-45391, read)"
meaning = "35 registers of predefined diagnostic data for the Advantys STB system"
source = "STBNIP2311 Applications Guide EIO0000000051.05 p. 125; the zero-based form is inferred from 45357-45391"
